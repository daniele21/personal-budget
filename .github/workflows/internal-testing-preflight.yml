name: Internal testing preflight

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-testing-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VITE_FIREBASE_API_KEY: ci-web-api-key
  VITE_FIREBASE_AUTH_DOMAIN: aura-ci-web.invalid
  VITE_FIREBASE_PROJECT_ID: aura-ci-web
  VITE_FIREBASE_STORAGE_BUCKET: aura-ci-web.invalid
  VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000010"
  VITE_FIREBASE_APP_ID: "1:100000000010:web:0000000000000000"
  VITE_FIRESTORE_DATABASE_ID: "(default)"

jobs:
  release-secret-inventory:
    name: Release secret inventory
    runs-on: ubuntu-latest
    steps:
      - name: List secret names only
        env:
          SECRET_MAP: ${{ toJSON(secrets) }}
        run: |
          echo "Configured GitHub Actions secret names:"
          jq -r 'keys[]' <<< "${SECRET_MAP}" | sort

  web:
    name: Web regression and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: AIzaSyA1234567890abcdefghijklmnopqrstuv
      VITE_FIREBASE_AUTH_DOMAIN: aura-ci.invalid
      VITE_FIREBASE_PROJECT_ID: aura-ci
      VITE_FIREBASE_STORAGE_BUCKET: aura-ci.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000002"
      VITE_FIREBASE_APP_ID: "1:100000000002:web:0000000000000001"
      VITE_FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regression
        run: npm run test:regression
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e

  android-host:
    name: Android JVM and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ANDROID_FIREBASE_API_KEY: ci-debug-api-key
      VITE_ANDROID_FIREBASE_AUTH_DOMAIN: aura-ci-debug.invalid
      VITE_ANDROID_FIREBASE_PROJECT_ID: aura-ci-debug
      VITE_ANDROID_FIREBASE_STORAGE_BUCKET: aura-ci-debug.invalid
      VITE_ANDROID_FIREBASE_MESSAGING_SENDER_ID: "100000000001"
      VITE_ANDROID_FIREBASE_APP_ID: "1:100000000001:web:0000000000000000"
      VITE_ANDROID_FIRESTORE_DATABASE_ID: "(default)"
      AURA_ANDROID_UPLOAD_STORE_FILE: /tmp/aura-ci-unused.jks
      AURA_ANDROID_UPLOAD_STORE_PASSWORD: unused
      AURA_ANDROID_UPLOAD_KEY_ALIAS: unused
      AURA_ANDROID_UPLOAD_KEY_PASSWORD: unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Install Android API 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Create synthetic debug Google Services config
        run: |
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000001",
              "project_id": "aura-ci-debug",
              "storage_bucket": "aura-ci-debug.invalid"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000001:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.staituned.aura.debug"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000001-ci.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-debug-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "100000000001-ci.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Sync debug assets
        run: npm run android:sync:debug
      - name: Android JVM tests
        run: npm run android:test
      - name: Android lint
        run: npm run android:lint

  android-release-smoke:
    name: Android release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_FIREBASE_API_KEY: ci-release-api-key
      VITE_FIREBASE_AUTH_DOMAIN: aura-ci-release.invalid
      VITE_FIREBASE_PROJECT_ID: aura-ci-release
      VITE_FIREBASE_STORAGE_BUCKET: aura-ci-release.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000010"
      VITE_FIREBASE_APP_ID: "1:100000000010:web:0000000000000000"
      VITE_FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Install Android API 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Create synthetic variant Google Services configs
        run: |
          mkdir -p android/app/src/debug android/app/src/release
          cat > android/app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000001",
              "project_id": "aura-ci-debug",
              "storage_bucket": "aura-ci-debug.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000001:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.staituned.aura.debug"
                }
              },
              "oauth_client": [{
                "client_id": "100000000001-debug.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{"current_key": "ci-debug-api-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
          cat > android/app/src/release/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000010",
              "project_id": "aura-ci-release",
              "storage_bucket": "aura-ci-release.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000010:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.staituned.aura"
                }
              },
              "oauth_client": [{
                "client_id": "100000000010-release.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{"current_key": "ci-release-api-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Sync production web assets
        run: npm run android:sync
      - name: Release readiness
        run: npm run android:verify:release-readiness
      - name: Generate ephemeral CI signing key
        run: |
          keytool -genkeypair             -keystore /tmp/aura-ci-release.jks             -storepass ci-release-password             -keypass ci-release-password             -alias aura-ci-release             -keyalg RSA             -keysize 2048             -validity 2             -dname "CN=Aura CI, OU=CI, O=Staituned, L=CI, ST=CI, C=IT"
      - name: Build minified release bundle
        env:
          AURA_ANDROID_UPLOAD_STORE_FILE: /tmp/aura-ci-release.jks
          AURA_ANDROID_UPLOAD_STORE_PASSWORD: ci-release-password
          AURA_ANDROID_UPLOAD_KEY_ALIAS: aura-ci-release
          AURA_ANDROID_UPLOAD_KEY_PASSWORD: ci-release-password
        run: bash scripts/run-android-gradle.sh :app:bundleRelease
      - name: Verify release bundle
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          test -s "${AAB}"
          test -s "${MAPPING}"
          VERIFY_OUTPUT="$(jarsigner -verify -verbose -certs "${AAB}" 2>&1)"
          printf '%s\n' "${VERIFY_OUTPUT}"
          grep -q "jar verified" <<< "${VERIFY_OUTPUT}"
          sha256sum "${AAB}" "${MAPPING}"
          echo "CI release smoke uses synthetic Firebase and an ephemeral self-signed key; it is not uploadable to Play."

  android-emulator:
    name: Android API 36 instrumentation and listener recovery
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SERIAL: emulator-5554
      VITE_ANDROID_FIREBASE_API_KEY: ci-debug-api-key
      VITE_ANDROID_FIREBASE_AUTH_DOMAIN: aura-ci-debug.invalid
      VITE_ANDROID_FIREBASE_PROJECT_ID: aura-ci-debug
      VITE_ANDROID_FIREBASE_STORAGE_BUCKET: aura-ci-debug.invalid
      VITE_ANDROID_FIREBASE_MESSAGING_SENDER_ID: "100000000001"
      VITE_ANDROID_FIREBASE_APP_ID: "1:100000000001:web:0000000000000000"
      VITE_ANDROID_FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Install Android API 36 emulator
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/emulator" >> "${GITHUB_PATH}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Create synthetic debug Google Services config
        run: |
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000001",
              "project_id": "aura-ci-debug",
              "storage_bucket": "aura-ci-debug.invalid"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000001:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.staituned.aura.debug"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000001-ci.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-debug-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "100000000001-ci.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Start API 36 emulator
        run: |
          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          echo "no" | avdmanager create avd --force --name aura_api_36 --package "system-images;android-36;google_apis;x86_64"
          test -f "${ANDROID_AVD_HOME}/aura_api_36.ini"
          sudo chown "${USER}" /dev/kvm || true
          nohup emulator -avd aura_api_36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/aura-emulator.log 2>&1 &
          EMULATOR_PID=$!
          DEVICE_READY=false
          for attempt in $(seq 1 90); do
            if adb devices | grep -Eq 'emulator-[0-9]+[[:space:]]+device'; then
              DEVICE_READY=true
              break
            fi
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              cat /tmp/aura-emulator.log
              exit 1
            fi
            sleep 2
          done
          if [ "${DEVICE_READY}" != "true" ]; then
            cat /tmp/aura-emulator.log
            exit 1
          fi
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              cat /tmp/aura-emulator.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aura-emulator.log
          exit 1
      - name: Android instrumentation
        run: npm run android:test:instrumentation
      - name: Listener background recovery
        run: npm run android:verify:listener-recovery
