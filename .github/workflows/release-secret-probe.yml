name: Release secret contract probe

on:
  push:
    branches:
      - ci/release-secret-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured secret names only
        env:
          SECRET_MAP: ${{ toJSON(secrets) }}
        run: |
          # Print keys only. Secret values are never echoed.
          jq -r 'keys[]' <<< "${SECRET_MAP}" | sort
