name: Release secret contract probe

on:
  push:
    branches:
      - ci/release-secret-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: play-console
    steps:
      - name: Report configured release names only
        env:
          S_AURA_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_PASSWORD != '' }}
          S_AURA_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.AURA_ANDROID_UPLOAD_KEY_ALIAS != '' }}
          S_AURA_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.AURA_ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          S_AURA_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AURA_ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          S_AURA_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.AURA_ANDROID_UPLOAD_KEYSTORE_B64 != '' }}
          S_AURA_ANDROID_UPLOAD_STORE_BASE64: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_BASE64 != '' }}
          S_AURA_ANDROID_UPLOAD_STORE_B64: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_B64 != '' }}
          S_AURA_ANDROID_UPLOAD_STORE_FILE: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_FILE != '' }}
          S_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          S_ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          S_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          S_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 != '' }}
          S_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
          S_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          S_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
          S_AURA_ANDROID_RELEASE_GOOGLE_SERVICES_JSON: ${{ secrets.AURA_ANDROID_RELEASE_GOOGLE_SERVICES_JSON != '' }}
          S_GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE != '' }}
          S_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
          S_VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY != '' }}
          S_VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN != '' }}
          S_VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' }}
          S_VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET != '' }}
          S_VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID != '' }}
          S_VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID != '' }}
          S_VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID != '' }}
          S_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY != '' }}
          S_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN != '' }}
          S_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
          S_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET != '' }}
          S_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID != '' }}
          S_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID != '' }}
          S_FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID != '' }}
          S_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
          V_AURA_ANDROID_UPLOAD_STORE_FILE: ${{ vars.AURA_ANDROID_UPLOAD_STORE_FILE != '' }}
          V_AURA_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.AURA_ANDROID_UPLOAD_KEY_ALIAS != '' }}
          V_GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON != '' }}
          V_VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY != '' }}
          V_VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN != '' }}
          V_VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID != '' }}
          V_VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET != '' }}
          V_VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID != '' }}
          V_VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID != '' }}
          V_VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID != '' }}
        run: |
          for key in $(env | grep -E '^[SV]_' | sort); do
            name="${key%%=*}"
            value="${key#*=}"
            if [ "${value}" = "true" ]; then
              case "${name}" in
                S_*) echo "secret:${name#S_}=present" ;;
                V_*) echo "var:${name#V_}=present" ;;
              esac
            fi
          done
