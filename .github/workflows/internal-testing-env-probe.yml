name: Internal testing environment secret probe

on:
  push:
    branches:
      - ci/internal-testing-env-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: internal-testing
      deployment: false
    steps:
      - name: Report present release secret aliases only
        env:
          HAS_AURA_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_PASSWORD != '' }}
          HAS_AURA_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.AURA_ANDROID_UPLOAD_KEY_ALIAS != '' }}
          HAS_AURA_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.AURA_ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          HAS_AURA_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AURA_ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_AURA_ANDROID_UPLOAD_STORE_BASE64: ${{ secrets.AURA_ANDROID_UPLOAD_STORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
          HAS_AURA_ANDROID_RELEASE_GOOGLE_SERVICES_JSON: ${{ secrets.AURA_ANDROID_RELEASE_GOOGLE_SERVICES_JSON != '' }}
          HAS_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
          HAS_GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE != '' }}
          HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          HAS_VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY != '' }}
          HAS_VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN != '' }}
          HAS_VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' }}
          HAS_VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET != '' }}
          HAS_VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID != '' }}
          HAS_VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID != '' }}
          HAS_VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID != '' }}
          HAS_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
          HAS_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON != '' }}
        run: |
          env | grep '^HAS_' | sort | while IFS='=' read -r name value; do
            if [ "${value}" = "true" ]; then
              echo "${name#HAS_}=present"
            fi
          done
