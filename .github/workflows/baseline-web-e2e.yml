name: Baseline web E2E

on:
  push:
    branches:
      - ci/baseline-web-e2e
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  VITE_FIREBASE_API_KEY: AIzaSyA1234567890abcdefghijklmnopqrstuv
  VITE_FIREBASE_AUTH_DOMAIN: aura-ci.invalid
  VITE_FIREBASE_PROJECT_ID: aura-ci
  VITE_FIREBASE_STORAGE_BUCKET: aura-ci.invalid
  VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000002"
  VITE_FIREBASE_APP_ID: "1:100000000002:web:0000000000000001"
  VITE_FIRESTORE_DATABASE_ID: "(default)"

jobs:
  web:
    name: Web regression and E2E baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regression
        run: npm run test:regression
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e
