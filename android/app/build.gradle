import groovy.json.JsonSlurper

def auraVersionFile = rootProject.file('version.properties')
if (!auraVersionFile.exists()) {
    throw new GradleException("Missing Android version file: ${auraVersionFile}")
}

def auraVersion = new Properties()
auraVersionFile.withInputStream { auraVersion.load(it) }

def auraVersionCodeValue = auraVersion.getProperty('VERSION_CODE')
def auraVersionNameValue = auraVersion.getProperty('VERSION_NAME')
if (!(auraVersionCodeValue ==~ /[1-9]\d*/) || auraVersionNameValue == null || auraVersionNameValue.trim().isEmpty()) {
    throw new GradleException(
        'android/version.properties must define a positive VERSION_CODE and a non-empty VERSION_NAME.'
    )
}

def auraVersionCode = auraVersionCodeValue.toInteger()
def auraVersionName = auraVersionNameValue.trim()

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'

def auraReleaseSigningEnvironment = [
    storeFile: System.getenv("AURA_ANDROID_UPLOAD_STORE_FILE"),
    storePassword: System.getenv("AURA_ANDROID_UPLOAD_STORE_PASSWORD"),
    keyAlias: System.getenv("AURA_ANDROID_UPLOAD_KEY_ALIAS"),
    keyPassword: System.getenv("AURA_ANDROID_UPLOAD_KEY_PASSWORD"),
]
def auraReleaseSigningConfigured = auraReleaseSigningEnvironment.values().every {
    it != null && !it.trim().isEmpty()
}

gradle.taskGraph.whenReady { taskGraph ->
    def auraReleaseTaskRequested = taskGraph.allTasks.any {
        it.path.toLowerCase().contains("release")
    }
    if (auraReleaseTaskRequested && !auraReleaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set all AURA_ANDROID_UPLOAD_* environment variables; never commit upload-key material."
        )
    }
}

android {
    namespace = "com.staituned.aura"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.staituned.aura"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode auraVersionCode
        versionName auraVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (auraReleaseSigningConfigured) {
                storeFile file(auraReleaseSigningEnvironment.storeFile)
                storePassword auraReleaseSigningEnvironment.storePassword
                keyAlias auraReleaseSigningEnvironment.keyAlias
                keyPassword auraReleaseSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Aura Dev"
            resValue "string", "title_activity_main", "Aura Dev"
            resValue "string", "package_name", "com.staituned.aura.debug"
            resValue "string", "custom_url_scheme", "com.staituned.aura.debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (auraReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.work:work-runtime:$workManagerVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    implementation project(':capacitor-android')
    kapt "androidx.room:room-compiler:$roomVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}

apply from: 'capacitor.build.gradle'

tasks.matching { it.name == "connectedDebugAndroidTest" }.configureEach {
    dependsOn(":notification-test-source:installDebug")
    finalizedBy(":notification-test-source:uninstallDebug")
}

def auraReleaseWebAssetsTask = tasks.register("verifyReleaseWebAssets") {
    group = "verification"
    description = "Rejects release builds containing stale Android debug Firebase assets."

    def webAssetsDirectory = file("src/main/assets/public")
    def debugGoogleServices = file("src/debug/google-services.json")
    def releaseGoogleServices = file("src/release/google-services.json")

    inputs.dir(webAssetsDirectory)
    inputs.files(debugGoogleServices, releaseGoogleServices)

    doLast {
        def readProjectMarkers = { File servicesFile, String variant ->
            if (!servicesFile.exists()) {
                throw new GradleException(
                    "Missing ${variant} Google Services configuration; run the release readiness verifier."
                )
            }

            def projectInfo = new JsonSlurper().parse(servicesFile).project_info
            def markers = [projectInfo?.project_id, projectInfo?.project_number]
                .collect { it?.toString()?.trim() }
                .findAll { it }
            if (markers.size() != 2) {
                throw new GradleException(
                    "The ${variant} Google Services configuration is missing project identity fields."
                )
            }
            return markers
        }

        if (!webAssetsDirectory.isDirectory()) {
            throw new GradleException(
                "Bundled WebView assets are missing; run npm run android:sync before a release build."
            )
        }

        def bundledSources = fileTree(webAssetsDirectory) {
            include "**/*.html"
            include "**/*.js"
        }.files
        if (bundledSources.isEmpty()) {
            throw new GradleException(
                "Bundled WebView assets are empty; run npm run android:sync before a release build."
            )
        }

        def releaseMarkers = readProjectMarkers(releaseGoogleServices, "release")
        def debugOnlyMarkers = readProjectMarkers(debugGoogleServices, "debug")
            .findAll { !releaseMarkers.contains(it) }
        def containsMarker = { String marker ->
            bundledSources.any { it.getText("UTF-8").contains(marker) }
        }

        if (debugOnlyMarkers.any { containsMarker(it) }) {
            throw new GradleException(
                "Release WebView assets contain the debug Firebase project; run npm run android:sync."
            )
        }
        if (!releaseMarkers.every { containsMarker(it) }) {
            throw new GradleException(
                "Release WebView assets do not contain the production Firebase project; run npm run android:sync."
            )
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(auraReleaseWebAssetsTask)
}
