apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def auraReleaseSigningEnvironment = [
    storeFile: System.getenv("AURA_ANDROID_UPLOAD_STORE_FILE"),
    storePassword: System.getenv("AURA_ANDROID_UPLOAD_STORE_PASSWORD"),
    keyAlias: System.getenv("AURA_ANDROID_UPLOAD_KEY_ALIAS"),
    keyPassword: System.getenv("AURA_ANDROID_UPLOAD_KEY_PASSWORD"),
]
def auraReleaseSigningConfigured = auraReleaseSigningEnvironment.values().every {
    it != null && !it.trim().isEmpty()
}

gradle.taskGraph.whenReady { taskGraph ->
    def auraReleaseTaskRequested = taskGraph.allTasks.any {
        it.path.toLowerCase().contains("release")
    }
    if (auraReleaseTaskRequested && !auraReleaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set all AURA_ANDROID_UPLOAD_* environment variables; never commit upload-key material."
        )
    }
}

android {
    namespace = "com.staituned.aura"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.staituned.aura"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (auraReleaseSigningConfigured) {
                storeFile file(auraReleaseSigningEnvironment.storeFile)
                storePassword auraReleaseSigningEnvironment.storePassword
                keyAlias auraReleaseSigningEnvironment.keyAlias
                keyPassword auraReleaseSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Aura Dev"
            resValue "string", "title_activity_main", "Aura Dev"
            resValue "string", "package_name", "com.staituned.aura.debug"
            resValue "string", "custom_url_scheme", "com.staituned.aura.debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (auraReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.work:work-runtime:$workManagerVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    implementation project(':capacitor-android')
    kapt "androidx.room:room-compiler:$roomVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}

apply from: 'capacitor.build.gradle'

tasks.matching { it.name == "connectedDebugAndroidTest" }.configureEach {
    dependsOn(":notification-test-source:installDebug")
    finalizedBy(":notification-test-source:uninstallDebug")
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
